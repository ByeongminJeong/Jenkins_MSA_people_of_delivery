name: Build, Push & Deploy to ECS

on:
  push:
    branches: [ develop ]  # develop에 push(PR merge) 시 실행

permissions:
  id-token: write    # OIDC용
  contents: read

env:
  AWS_REGION: ap-northeast-2  # 리전

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      changed: ${{ steps.build-matrix.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      # 모듈별 변경 감지
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ github.token }}
          filters: |
            ai:
              - 'ai-service/**'
            store:
              - 'store-service/**'
            cart:
              - 'cart-service/**'
            user:
              - 'user-service/**'
            auth:
              - 'auth-service/**'
            common:
              - 'module-common/**'

      # 매트릭스 JSON 생성
      - name: Build matrix JSON
        id: build-matrix
        shell: bash
        run: |
          modules=()

          if [ "${{ steps.filter.outputs.store }}" = "true" ]; then
            modules+=("{\"name\":\"store-service\",\"repo\":\"peopleofdelivery/store-service\"}")
          fi
          if [ "${{ steps.filter.outputs.cart }}" = "true" ]; then
            modules+=("{\"name\":\"cart-service\",\"repo\":\"peopleofdelivery/cart-service\"}")
          fi
          if [ "${{ steps.filter.outputs.user }}" = "true" ]; then
            modules+=("{\"name\":\"user-service\",\"repo\":\"peopleofdelivery/user-service\"}")
          fi
          if [ "${{ steps.filter.outputs.auth }}" = "true" ]; then
            modules+=("{\"name\":\"auth-service\",\"repo\":\"peopleofdelivery/auth-service\"}")
          fi
          if [ "${{ steps.filter.outputs.ai }}" = "true" ]; then
            modules+=("{\"name\":\"ai-service\",\"repo\":\"peopleofdelivery/ai-service\"}")
          fi
          if [ "${{ steps.filter.outputs.common }}" = "true" ]; then
            modules+=("{\"name\":\"module-common\",\"repo\":\"peopleofdelivery/module-common\"}")
          fi

          # common 변경 시 모든 모듈 재빌드
          if [ "${{ steps.filter.outputs.common }}" = "true" ]; then
            modules=( \
              "{\"name\":\"store-service\",\"repo\":\"peopleofdelivery/store-service\"}" \
              "{\"name\":\"cart-service\",\"repo\":\"peopleofdelivery/cart-service\"}" \
              "{\"name\":\"user-service\",\"repo\":\"peopleofdelivery/user-service\"}" \
              "{\"name\":\"auth-service\",\"repo\":\"peopleofdelivery/auth-service\"}" \
              "{\"name\":\"ai-service\",\"repo\":\"peopleofdelivery/ai-service\"}" \
              "{\"name\":\"module-common\",\"repo\":\"peopleofdelivery/module-common\"}" \
            )
          fi

          if [ ${#modules[@]} -eq 0 ]; then
            echo '{"include":[]}' > matrix.json
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            printf '{"include":[%s]}\n' "$(IFS=,; echo "${modules[*]}")" > matrix.json
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT
          echo "Generated matrix:"
          cat matrix.json

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    outputs:
      image: ${{ steps.build.outputs.image }}
      module: ${{ steps.build.outputs.module }}

    steps:
      - uses: actions/checkout@v4

      # AWS OIDC 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker Build & Push
      - name: Build & Push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          MODULE=${{ matrix.name }}
          REPO=${{ matrix.repo }}
          SHORT_SHA=${GITHUB_SHA::7}

          IMAGE=${ECR_REGISTRY}/${REPO}
          TAG=develop-${SHORT_SHA}

          echo "Building ${IMAGE}:${TAG}"
          docker build -t ${IMAGE}:${TAG} -f ${MODULE}/Dockerfile .
          docker push ${IMAGE}:${TAG}

          echo "image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
          echo "module=${MODULE}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # 새 태스크 정의 등록 (Secrets 포함 치환)
      - name: Register new task definition
        run: |
          sed -e "s|<IMAGE>|${{ needs.build-and-push.outputs.image }}|" \
              -e "s|<DB_URL>|${{ secrets.DB_URL }}|" \
              -e "s|<DB_USERNAME>|${{ secrets.DB_USERNAME }}|" \
              -e "s|<DB_PASSWORD>|${{ secrets.DB_PASSWORD }}|" \
              ${{ matrix.name }}/taskdef.json > new-taskdef.json

          aws ecs register-task-definition --cli-input-json file://new-taskdef.json

      # ECS 서비스 업데이트 (Blue/Green 배포 트리거)
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster cloudfour \
            --service ${{ matrix.name }}-task-service-blue_green \
            --task-definition ${{ matrix.name }}-task \
            --force-new-deployment
  
