version: '3.8'

services:
  jenkins:
    image: ubuntu:22.04
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/lib/jenkins
      - /var/run/docker.sock:/var/run/docker.sock
      - $PWD:/workspace
    user: root
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JAVA_OPTS=-Xmx2g -Xms1g -XX:+UseG1GC -Djava.awt.headless=true
    command: >
      bash -c "
        # 시스템 업데이트
        apt-get update &&
        apt-get install -y wget curl gnupg2 software-properties-common &&
        
        # Java 11 설치
        apt-get install -y openjdk-11-jdk &&
        
        # Docker 설치
        apt-get install -y docker.io &&
        
        # Jenkins 저장소 키 추가
        wget -q -O - https://pkg.jenkins.io/debian/jenkins.io.key | apt-key add - &&
        sh -c 'echo deb http://pkg.jenkins.io/debian-stable binary/ > /etc/apt/sources.list.d/jenkins.list' &&
        
        # 패키지 목록 업데이트 및 Jenkins 설치
        apt-get update &&
        apt-get install -y jenkins &&
        
        # Jenkins 사용자 생성 및 권한 설정
        useradd -r -g jenkins -d /var/lib/jenkins -s /bin/bash jenkins &&
        usermod -aG docker jenkins &&
        chown -R jenkins:jenkins /var/lib/jenkins &&
        chmod 666 /var/run/docker.sock &&
        
        # Jenkins 시작
        service jenkins start &&
        
        # 컨테이너 유지
        tail -f /var/log/jenkins/jenkins.log
      "

volumes:
  jenkins_home: